name: Auto Music Sync

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install yt-dlp

    - name: Run Auto Sync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python -c '
        import os
        from yt_dlp import YoutubeDL

        queries = [
            "scsearch: Poshlaya Molly",
            "scsearch: mylancore remix",
            "scsearch: Platina rap",
            "scsearch: Friendly Thug 52",
            "scsearch: OG Buda"
        ]

        existing = set()
        for f in os.listdir("."):
            if f.endswith(".mp3"):
                existing.add(f[:-4].lower().strip())

        ydl_opts = {
            "format": "bestaudio/best",
            "postprocessors": [{"key": "FFmpegExtractAudio", "preferredcodec": "mp3", "preferredquality": "192"}],
            "outtmpl": "%(title)s.%(ext)s",
            "quiet": True,
            "no_warnings": True,
        }

        downloaded = False
        with YoutubeDL(ydl_opts) as ydl:
            for q in queries:
                try:
                    info = ydl.extract_info(q, download=False)
                    entries = info.get("entries", [info])
                    for e in entries[:1]:
                        if not e: continue
                        title = e.get("title")
                        clean = title.replace("/", "_").replace("\\", "_").strip()
                        if clean.lower() in existing:
                            continue
                        ydl.download([e.get("webpage_url")])
                        downloaded = True
                        existing.add(clean.lower())
                except Exception as err:
                    print(f"Ошибка: {err}")

        if downloaded:
            os.system("git config --global user.name '\''GitHub Action Bot'\''")
            os.system("git config --global user.email '\''action@github.com'\''")
            os.system("git add *.mp3")
            os.system("git commit -m '\''Auto-add tracks'\''")
            os.system("git push https://x-access-token:" + os.environ.get("GITHUB_TOKEN") + "@github.com/yutyityu546/Tracks.git main")
            print("Готово!")
        else:
            print("Новых треков нет.")
        '
